/* ==========================================================================
   talk1/deck/theme/tokens.css — talk #1's OWN palette
   ("From Prompts to Convergence", Craft 2026)

   Every value here was lifted VERBATIM from the 52 self-contained source
   slides in the delivered deck (each carried its own ad-hoc :root block plus
   hardcoded literals). This file is the union of those blocks, so that
   check.mjs rule (e) — "no hex colors in fragments" — can stay on while the
   port stays byte-faithful to what was projected.

   Do NOT reuse deck/theme/tokens.css or meetup/deck/theme/tokens.css values
   here: those were re-derived for talk #2 and drift from the originals.

   Naming shape
   ------------
   1. GENERIC aliases (--blue, --cyan, --navy, --muted, --white, --green,
      --warning, --soft ...) are the names the source slides themselves used.
      They resolve to the LIGHT content family by default, because 41 of the
      52 sources are light content slides. `.slide[data-theme="dark"]`
      re-points them to the dark family.
   2. EXPLICIT names (--blue-title, --cyan-section, --navy-mid ...) address one
      specific source value unambiguously. Ported fragments that need a value
      the generic alias does not currently carry use these directly.

   Tokens only — no component rules here (see components.css).
   ========================================================================== */

:root {
  /* ======================================================================
     BLUES — the deck's primary accent. Three source families used the name
     --blue with three different values.
     ====================================================================== */
  --blue-content: #1265ff;      /* light content slides (30 sources)        */
  --blue-title: #2f67ff;        /* title / dark hero family                 */
  --blue-title-2: #3d7cff;      /* title --blue2                            */
  --blue-section: #1683ff;      /* section-divider slides                   */
  --blue-bright: #4aa3ff;       /* small bright fill on dark                */
  --blue-google: #1a73e7;       /* delivered slides 1-2 ONLY. Not a source
                                   :root value: those two slides were varied
                                   inside Google Slides and their accent runs
                                   ("Convergence", the title rule, the ABOUT ME
                                   kicker) are the Google Slides brand blue.
                                   Measured off raw/talk/slides/slide-01.png
                                   and slide-02.png, where this blue caps at
                                   231 in the blue channel while every other
                                   delivered blue reaches 255.               */

  /* ======================================================================
     CYANS — decor on light, accent on dark. #19d7ff is decor-only on light
     (it fails text contrast there); the readable ink variant is --cyan-ink.
     ====================================================================== */
  --cyan-decor: #19d7ff;        /* light-slide flow-bg gradient stop        */
  --cyan-section: #62dcff;      /* section-divider accent                   */
  --cyan-title: #66e6ef;        /* title-slide accent                       */
  --cyan-ink: #0786b7;          /* cyan used as TEXT on a light surface     */

  /* ======================================================================
     LIGHT-SLIDE INK — text colors on the white/blue paper family.
     ====================================================================== */
  --navy-ink: #07152f;          /* source --navy: default body ink          */
  --ink: #10203d;               /* card headings / callout text             */
  --ink-2: #20304c;             /* card body copy                           */
  --ink-3: #243653;
  --ink-4: #24334f;
  --ink-5: #485875;
  --muted-ink: #63718a;         /* source --muted                           */
  --muted-ink-2: #6f7f98;
  --muted-ink-3: #7a8aa3;

  /* ======================================================================
     LIGHT SURFACES — the paper gradient and the tinted panels on top of it.
     ====================================================================== */
  --paper-0: #ffffff;           /* .slide gradient 0%                       */
  --paper-1: #f8fbff;           /* .slide gradient 48%                      */
  --paper-2: #eef7ff;           /* .slide gradient 100%                     */
  --soft-blue: #eaf3ff;         /* source --soft                            */
  --soft-blue-2: #edf5ff;
  --soft-blue-3: #dcecff;
  --soft-blue-4: #e7f2ff;
  --soft-blue-5: #f9fcff;
  --soft-blue-6: #e5f1ff;

  /* ======================================================================
     DARK CANVASES — title, section dividers, and the terminal/quote slides.
     Each source family picked its own three-stop gradient; all are kept.
     ====================================================================== */
  --navy-title-0: #050814;      /* title gradient 0%                        */
  --navy-title-1: #07142c;      /* title gradient 48%                       */
  --navy-title-2: #050711;      /* title gradient 100%                      */
  --navy-title-ink: #050a17;    /* title-slide source --navy                */
  --deep: #020814;              /* section-divider gradient 0% / 100%       */
  --navy-deep-1: #04142a;       /* section-divider gradient 52%             */
  --navy-mid: #061329;          /* dark content gradient 0%                 */
  --navy-mid-2: #071a38;
  --navy-mid-3: #081226;
  --navy-panel: #0c1b37;        /* panel ink on dark                        */
  --dark: #080d16;              /* source --dark                            */
  --dark-grad-0: #0d1420;       /* terminal frame gradient top              */
  --dark-grad-1: #070b12;       /* terminal frame gradient bottom           */
  --terminal: #0a0f18;          /* source --terminal                        */
  --white-ink: #f7fbff;         /* source --white: body ink on dark         */

  /* ======================================================================
     GREEN — the "this works / after" family.
     ====================================================================== */
  --green-base: #0b8a4b;        /* source --green                           */
  --green-bg-base: #ecf8f1;     /* source --green-bg                        */
  --green-bg-2: #f1fff6;
  --green-bg-3: #ddf5e7;
  --green-dark: #113824;        /* green callout text                       */
  --green-on-dark: #43d08a;     /* green accent on a dark canvas            */
  --green-tint-ink: #dfffee;    /* pale green text on dark                  */

  /* ======================================================================
     WARNING / WARM — the "this fails / before" family.
     ====================================================================== */
  --warning-base: #ef6a5a;      /* source --warning                         */
  --warning-bg-base: #fff1ee;   /* source --warning-bg                      */
  --warning-bg-2: #fff7f5;
  --warning-bg-3: #ffe8e3;
  --warning-dark: #5a1720;      /* warning callout text                     */
  --warning-ink: #9e4c44;       /* softer warning text                      */

  /* ======================================================================
     PURPLE + ORANGE — occasional third/fourth categories.
     ====================================================================== */
  --purple-base: #7446c8;       /* source --purple                          */
  --purple-bg: #f6f1ff;
  --purple-bg-2: #e8ddff;
  --orange-base: #b46b12;       /* source --orange                          */
  --orange-dark: #8a520e;

  /* ======================================================================
     GENERIC ALIASES — the names the source :root blocks used. Light family
     by default; `.slide[data-theme="dark"]` re-points them below.
     ====================================================================== */
  --blue: var(--blue-content);
  --blue2: var(--blue-content);
  --cyan: var(--cyan-decor);
  --navy: var(--navy-ink);
  --muted: var(--muted-ink);
  --soft: var(--soft-blue);
  --white: var(--paper-0);
  --green: var(--green-base);
  --green-bg: var(--green-bg-base);
  --warning: var(--warning-base);
  --warning-bg: var(--warning-bg-base);
  --purple: var(--purple-base);
  --orange: var(--orange-base);

  /* canvas gradient stops the .slide rule reads (light family by default) */
  --canvas-0: var(--paper-0);
  --canvas-1: var(--paper-1);
  --canvas-2: var(--paper-2);
  --canvas-ink: var(--navy-ink);

  /* ======================================================================
     HAIRLINES, SURFACES, SHADOWS, GLOWS
     The originals wrote these as rgba() literals (which the linter permits);
     tokenised here so the recurring ones have one authority. Verbatim.
     ====================================================================== */
  --hairline-blue: rgba(18, 101, 255, 0.12);        /* .slide border        */
  --hairline-blue-2: rgba(18, 101, 255, 0.16);      /* card border          */
  --hairline-blue-3: rgba(18, 101, 255, 0.22);
  --hairline-green: rgba(11, 138, 75, 0.18);
  --hairline-green-2: rgba(11, 138, 75, 0.2);
  --hairline-warning: rgba(239, 106, 90, 0.18);
  --hairline-warning-2: rgba(239, 106, 90, 0.22);
  --hairline-purple: rgba(116, 70, 200, 0.16);
  --hairline-cyan: rgba(25, 215, 255, 0.14);
  --hairline-cyan-2: rgba(25, 215, 255, 0.18);
  --hairline-cyan-3: rgba(98, 220, 255, 0.22);
  --hairline-on-dark: rgba(247, 251, 255, 0.14);

  --card-bg: rgba(255, 255, 255, 0.94);
  --card-bg-soft: rgba(255, 255, 255, 0.88);
  --card-bg-dark: rgba(255, 255, 255, 0.08);
  --panel-bg: rgba(255, 255, 255, 0.86);
  --panel-bg-dark: rgba(6, 19, 41, 0.68);

  --callout-bg-blue: rgba(231, 242, 255, 0.84);
  --callout-bg-green: rgba(236, 248, 241, 0.94);
  --callout-bg-warning: rgba(255, 241, 238, 0.86);

  --muted-on-dark: rgba(247, 251, 255, 0.86);
  --muted-on-dark-2: rgba(247, 251, 255, 0.76);
  --muted-on-dark-3: rgba(247, 251, 255, 0.72);
  --muted-on-dark-4: rgba(247, 251, 255, 0.82);

  --shadow-card: 0 20px 54px rgba(12, 67, 160, 0.1);
  --shadow-card-sm: 0 16px 40px rgba(12, 67, 160, 0.08);
  --shadow-card-lg: 0 22px 58px rgba(12, 67, 160, 0.1);

  --glow-blue: 0 0 18px rgba(47, 103, 255, 0.46);
  --glow-cyan-decor: 0 0 26px rgba(25, 215, 255, 0.38);
  --glow-cyan-section: 0 0 22px rgba(98, 220, 255, 0.42);

  /* ======================================================================
     TYPOGRAPHY

     "PinnedSF" is assets/fonts/SFNS.ttf, emitted as @font-face by build.mjs.
     The delivered talk-1 slides named `Inter` first, but Inter is not
     installed on the authoring machine, so the stack resolved through
     BlinkMacSystemFont to the macOS system font — that is what was actually
     projected. Pinning the system font file, plus the theme/tracking.json
     correction table, reproduces it on any machine. Keep "PinnedSF" FIRST:
     tools/tracking.mjs only corrects elements whose computed stack names it,
     which is how the monospace blocks stay untouched.
     ====================================================================== */
  --font-sans: "PinnedSF", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-mono: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;

  /* type scale — the values that repeat across the sources. Per-slide sizes
     that appear once stay in the fragment's own scoped <style>. */
  --fs-h1: 58px;                /* dominant content-slide h1 (16 sources)   */
  --fs-h1-lg: 72px;             /* wide/short headline variant              */
  --fs-subtitle: 34px;
  --fs-callout: 28px;           /* .bottom-callout                          */
  --fs-body: 24px;
  --fs-kicker: 23px;
  --fs-label: 20px;
  --fs-small: 17px;
  --fs-micro: 14px;

  --lh-tight: 1.02;
  --lh-body: 1.24;
  --ls-h1: -0.045em;
  --ls-kicker: 0.06em;
  --fw-h1: 850;
  --fw-kicker: 850;

  /* ======================================================================
     SLIDE CHROME — geometry lifted from the source .slide/.content rules.
     ====================================================================== */
  --slide-max-w: 1600px;        /* source: width: min(100vw, 1600px)        */
  --pad-top: 62px;              /* dominant .content padding (17 sources)   */
  --pad-x: 76px;
  --pad-bottom: 58px;
  --radius-card: 30px;
  --radius-callout: 22px;
  --radius-chip: 999px;
  --accent-w: 70px;             /* dominant .accent-line (13 sources)       */
  --accent-h: 7px;

  --stage-bg: #111827;          /* page behind the slide (source body bg)   */
}

/* ==========================================================================
   DARK FAMILY — re-points the generic aliases for `data-theme="dark"`
   fragments (title slide, section dividers, quote/terminal slides).

   Base values are the section-divider family, the most common dark source.
   The title slide's own blues/cyan are one token away (--blue-title,
   --cyan-title) for the fragments that need them.
   ========================================================================== */
.slide--dark,
.slide[data-theme="dark"] {
  --blue: var(--blue-section);
  --blue2: var(--blue-title-2);
  --cyan: var(--cyan-section);
  --navy: var(--navy-deep-1);
  --muted: var(--muted-on-dark);
  --white: var(--white-ink);
  --green: var(--green-on-dark);
  --soft: var(--white-ink);

  --canvas-0: var(--deep);
  --canvas-1: var(--navy-deep-1);
  --canvas-2: var(--deep);
  --canvas-ink: var(--white-ink);
}

/* ==========================================================================
   talk1/deck/theme/components.css — the shared vocabulary of talk #1

   Deliberately MINIMAL. The 52 source slides had no shared stylesheet: each
   was self-contained, and most of its CSS was one-off layout for that slide
   alone. Only the handful of patterns that genuinely repeat across files are
   promoted here, at THEIR values (surveyed 2026-08-25 over all 52 sources):

     .slide          52/52   the 16:9 canvas
     .content        52/52   the padded inner frame
     .accent-line    52/52   the rule under the headline
     .flow-bg        48/48   the background artwork layer
     .kicker         30      the uppercase eyebrow
     .card           29      base card shell (each slide extends it)
     .bottom-callout 25      the full-width takeaway strip
     h1              16      the dominant headline shape

   Everything else stays in each fragment's own scoped <style>, which is how
   the originals were written and what keeps the port faithful.

   NO ENTRANCE MOTION. The delivered deck had none; the other decks' fadeUp
   keyframe is intentionally absent here — adding it would be a redesign, not
   a port.

   Fragments never declare hex colors (check.mjs rule (e)); they use the
   tokens in tokens.css.
   ========================================================================== */

* { box-sizing: border-box; }

body { font-family: var(--font-sans); }

/* ---- the 16:9 canvas ----------------------------------------------------
   Source: `width: min(100vw, 1600px); aspect-ratio: 16 / 9; overflow: hidden`.
   Here the width is FIXED at the design width instead of viewport-relative:
   the type is fixed-px, so a viewport-dependent width changes every line
   break. The shell scales the finished canvas with
   transform: scale(var(--deck-scale)) — it never reflows it.

   Light is the default family (41 of 52 sources). data-theme="dark" swaps
   the canvas tokens (see tokens.css) and drops the light border.
   -------------------------------------------------------------------------- */
.slide {
  position: relative;
  width: var(--slide-max-w);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  flex: none;
  background: linear-gradient(
    135deg,
    var(--canvas-0) 0%,
    var(--canvas-1) 48%,
    var(--canvas-2) 100%
  );
  color: var(--canvas-ink);
  font-family: var(--font-sans);
  border: 1px solid var(--hairline-blue);
}

.slide--dark,
.slide[data-theme="dark"] {
  border: 1px solid var(--hairline-cyan);
}

/* ---- inner frame ---------------------------------------------------------
   Source dominant: padding 62px 76px 58px, z-index 2, flex column. Slides
   that need a grid override `display` in their own <style>.
   -------------------------------------------------------------------------- */
.content {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  display: flex;
  flex-direction: column;
}

/* ---- background artwork layer --------------------------------------------
   Source dominant: an inline SVG field parked top-right at 20% opacity.
   Individual slides retune size/opacity locally.
   -------------------------------------------------------------------------- */
.flow-bg {
  position: absolute;
  right: -8%;
  top: -8%;
  width: 56%;
  height: 68%;
  opacity: 0.2;
  pointer-events: none;
}

/* ---- eyebrow -------------------------------------------------------------
   Source dominant (22 of 30): blue, 850, 0.06em, uppercase, 23px, 16px below.
   Green / warning / cyan variants exist per slide — set `color` locally.
   -------------------------------------------------------------------------- */
.kicker {
  color: var(--blue);
  font-weight: var(--fw-kicker);
  letter-spacing: var(--ls-kicker);
  text-transform: uppercase;
  font-size: var(--fs-kicker);
  margin-bottom: 16px;
}

/* ---- headline ------------------------------------------------------------
   Source dominant (16 of 52): 58px / 1.02 / -0.045em / 850, max-width 1180px.
   -------------------------------------------------------------------------- */
.slide h1 {
  margin: 0;
  font-size: var(--fs-h1);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-h1);
  font-weight: var(--fw-h1);
  max-width: 1180px;
}

/* ---- rule under the headline ---------------------------------------------
   Source dominant (13 of 52): 70x7 pill, blue, margin 24px 0 34px. The green
   and warning variants below are the other two recurring colors.
   -------------------------------------------------------------------------- */
.accent-line {
  width: var(--accent-w);
  height: var(--accent-h);
  border-radius: var(--radius-chip);
  background: var(--blue);
  margin: 24px 0 34px;
}
.accent-line--green { background: var(--green); }
.accent-line--warning { background: var(--warning); }

/* ---- card ----------------------------------------------------------------
   The 29 source cards agree on the shell (rounded, translucent white, faint
   blue hairline, soft blue-cast shadow) and disagree on everything else
   (height, padding, inner layout). Only the shell is shared here.
   -------------------------------------------------------------------------- */
.card {
  border-radius: var(--radius-card);
  background: var(--card-bg);
  border: 1px solid var(--hairline-blue-2);
  box-shadow: var(--shadow-card);
}

/* ---- bottom callout ------------------------------------------------------
   Source dominant: a full-width takeaway strip under the body. Three color
   moods recur: neutral blue, green (it works), warning (it fails).
   -------------------------------------------------------------------------- */
.bottom-callout {
  margin-top: 22px;
  border-radius: var(--radius-callout);
  background: var(--callout-bg-blue);
  border: 1px solid var(--hairline-blue);
  min-height: 82px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 28px;
  font-size: var(--fs-callout);
  line-height: 1.18;
  color: var(--ink);
  font-weight: 800;
}
.bottom-callout--green {
  background: var(--callout-bg-green);
  border-color: var(--hairline-green);
  color: var(--green-dark);
}
.bottom-callout--warning {
  background: var(--callout-bg-warning);
  border-color: var(--hairline-warning);
  color: var(--warning-dark);
}

/* ---- misc ----------------------------------------------------------------- */
.mono { font-family: var(--font-mono); }


html, body { margin: 0; }
body { background: var(--stage-bg); min-height: 100vh; }
.deck-counter {
  position: fixed; bottom: 14px; right: 20px; z-index: 50;
  color: rgba(247,251,255,0.45);
  font: 650 14px/1 var(--font-sans); letter-spacing: 0.06em;
}
/* shell chrome reacts to the active slide's data-theme (1337 notes, idea 2) */
body[data-active-theme="light"] { background: #dfe7f2; }
body[data-active-theme="light"] .deck-counter { color: rgba(7,21,47,0.50); }
@media screen {
  body.deck-mode { display: grid; place-items: center; height: 100vh; overflow: hidden; }
  .deck .slide { display: none; }
  .deck .slide.active { display: flex; }
  /* Fixed-canvas fit: the slide lays out at --slide-max-w (see components.css)
     and is scaled — not reflowed — to the viewport. --deck-scale is set by the
     fit script on load + resize. Centering via the fixed left/top 50% +
     translate(-50%,-50%) pattern — grid place-items center misplaces an
     item larger than the viewport (Opus visual check, 2026-07-19). */
  .deck .slide.active,
  body.single-mode .slide {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--deck-scale, 1));
    transform-origin: center center;
  }
  body.single-mode { display: grid; place-items: center; height: 100vh; overflow: hidden; }
}
@media print {
  body { background: none; }
  .deck .slide {
    display: flex !important;
    width: 1600px; height: 900px; aspect-ratio: auto;
    transform: none !important;
    page-break-after: always; break-after: page;
  }
  .deck-counter { display: none; }
  @page { size: 1600px 900px; margin: 0; }
}

</style>
</head>
